services:
  - type: web
    name: professional-narrators-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: TOPIC_1
        sync: false
      - key: TOPIC_2
        sync: false
      - key: TOPIC_3
        sync: false
      - key: TOPIC_4
        sync: false
      - key: TOPIC_5
        sync: false
      - key: TOPIC_6
        sync: false
      - key: TOPIC_7
        sync: false
      - key: TOPIC_8
        sync: false
      - key: TOPIC_9
        sync: false
      - key: DB_PATH
        value: /tmp/bot_data.db
